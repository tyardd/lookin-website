<!DOCTYPE html><html><head><meta charset="utf-8"><title>Lookin waveform animation</title><style>
body{margin:0;background:#17181C;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#fff;padding:32px}
figure{margin:0 auto;max-width:680px;border:1px solid rgba(255,255,255,.1);background:#1D1F24;border-radius:12px;padding:24px}
.g{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;align-items:end}
.l{display:flex;justify-content:space-between;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.18em;color:#8B919D;margin-bottom:8px}
svg{width:100%;display:block;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:#17181C}
figcaption{margin-top:16px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px;font-size:12px;line-height:1.6;color:#8B919D}
@media(max-width:574px){.g{grid-template-columns:1fr}}
/* waveform animation (Technology section): record -> window -> FFT, looping */
@keyframes wf-trace {
  0% { stroke-dashoffset: 1; opacity: 1; }
  24% { stroke-dashoffset: 0; }
  92% { stroke-dashoffset: 0; opacity: 1; }
  100% { stroke-dashoffset: 0; opacity: 0; }
}
@keyframes wf-window {
  0%, 27% { opacity: 0; }
  33%, 92% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes wf-fft {
  0%, 35% { opacity: 0; }
  40%, 92% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes wf-spec {
  0%, 42% { stroke-dashoffset: 1; opacity: 1; }
  64% { stroke-dashoffset: 0; }
  92% { stroke-dashoffset: 0; opacity: 1; }
  100% { stroke-dashoffset: 0; opacity: 0; }
}
@keyframes wf-mark-1 {
  0%, 66% { opacity: 0; }
  69%, 92% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes wf-mark-2 {
  0%, 70% { opacity: 0; }
  73%, 92% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes wf-mark-3 {
  0%, 74% { opacity: 0; }
  77%, 92% { opacity: 1; }
  100% { opacity: 0; }
}
.wf-trace,
.wf-spec {
  stroke-dasharray: 1;
  stroke-dashoffset: 0;
}
.wf-trace { animation: wf-trace 10s linear infinite; }
.wf-window { animation: wf-window 10s linear infinite; }
.wf-fft { animation: wf-fft 10s linear infinite; }
.wf-spec { animation: wf-spec 10s linear infinite; }
.wf-mark-1 { animation: wf-mark-1 10s linear infinite; }
.wf-mark-2 { animation: wf-mark-2 10s linear infinite; }
.wf-mark-3 { animation: wf-mark-3 10s linear infinite; }

/* people who ask for reduced motion see the finished picture, not the loop */
@media (prefers-reduced-motion: reduce) {
  .wf-trace,
  .wf-window,
  .wf-fft,
  .wf-spec,
  .wf-mark {
    animation: none;
  }
  html {
    scroll-behavior: auto !important;
  }
}

</style></head><body><figure><div class="g">
